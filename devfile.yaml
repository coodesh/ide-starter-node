schemaVersion: 2.2.0
metadata:
  name: ide-starter-node
components:
  - name: tools
    container:
      endpoints:
        - name: app
          targetPort: 3000
          exposure: public
commands:
  - id: install
    exec:
      component: tools
      commandLine: "npm install --no-audit --no-fund"
      workingDir: ${PROJECT_SOURCE}
  - id: start
    exec:
      component: tools
      commandLine: "npm start"
      workingDir: ${PROJECT_SOURCE}
  - id: test
    exec:
      component: tools
      commandLine: "npm test"
      workingDir: ${PROJECT_SOURCE}
events:
  postStart:
    - install
    - start
